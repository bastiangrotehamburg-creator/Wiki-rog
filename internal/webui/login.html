<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden – Wiki-rog</title>
<style>
  :root {
    --bg: #f5f7f9; --panel: #ffffff; --border: #dfe4ea; --text: #1a2430;
    --muted: #5b6b7b; --accent: #206ea7; --accent-hover: #1b5e8f; --logo: #206ea7;
    --err-bg: #fdecec; --err-text: #a12626; --err-border: #f3c2c2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12181e; --panel: #1a222b; --border: #2b3742;
      --text: #e8eef4; --muted: #93a3b3; --accent: #4a9fd4; --accent-hover: #64b0e0; --logo: #67b0dc;
      --err-bg: #3a1f22; --err-text: #f0a8a8; --err-border: #5c3033;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px; width: 340px; max-width: calc(100vw - 32px); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand h1 { margin: 0; font-size: 20px; }
  p.sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input { width: 100%; padding: 11px 12px; border-radius: 10px; font-size: 15px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
  button { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
  button:hover { background: var(--accent-hover); }
  .error { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 10px;
    background: var(--err-bg); color: var(--err-text); border: 1px solid var(--err-border); font-size: 13px; }
</style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="15.5" width="18" height="4" rx="1" fill="var(--logo)"/>
        <rect x="4.5" y="10.5" width="15" height="4" rx="1" fill="var(--logo)" opacity="0.8"/>
        <rect x="6" y="5.5" width="12" height="4" rx="1" fill="var(--logo)" opacity="0.6"/>
      </svg>
      <h1>Wiki-rog</h1>
    </div>
    <p class="sub">Bitte anmelden, um dein Wiki zu fragen.</p>
    <label for="u">Benutzername</label>
    <input id="u" name="username" autocomplete="username" autofocus required>
    <label for="p">Passwort</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Anmelden</button>
    <div class="error" id="err">Anmeldung fehlgeschlagen. Bitte erneut versuchen.</div>
  </form>
  <script>
    if (new URLSearchParams(location.search).has('e')) {
      document.getElementById('err').style.display = 'block';
    }
  </script>
</body>
</html>
