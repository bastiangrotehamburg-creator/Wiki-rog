<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutzerverwaltung – Wiki-rog</title>
<style>
  :root {
    --bg: #f5f7f9; --panel: #ffffff; --border: #dfe4ea; --text: #1a2430;
    --muted: #5b6b7b; --accent: #206ea7; --accent-hover: #1b5e8f; --logo: #206ea7;
    --danger: #b23b3b; --ok: #2e7d46;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12181e; --panel: #1a222b; --border: #2b3742;
      --text: #e8eef4; --muted: #93a3b3; --accent: #4a9fd4; --accent-hover: #64b0e0; --logo: #67b0dc;
      --danger: #e08585; --ok: #7bd39a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; align-items: center; gap: 10px; }
  header h1 { margin: 0; font-size: 18px; }
  header a { margin-left: auto; color: var(--accent); text-decoration: none; font-size: 14px;
    border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 18px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=password] { width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }
  .groups { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
  .groups label { display: inline-flex; align-items: center; gap: 6px; margin: 0; color: var(--text); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent);
    color: #fff; font-size: 14px; cursor: pointer; margin-top: 14px; }
  button:hover { background: var(--accent-hover); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .del { background: transparent; color: var(--danger); border: 1px solid var(--border);
    padding: 6px 10px; margin: 0; }
  .del:hover { border-color: var(--danger); background: transparent; }
  .msg { margin-top: 10px; font-size: 13px; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--ok); }
  .edit { background: transparent; color: var(--accent); border: 1px solid var(--border);
    padding: 6px 10px; margin: 0 8px 0 0; }
</style>
</head>
<body>
<header>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="3" y="15.5" width="18" height="4" rx="1" fill="var(--logo)"/>
    <rect x="4.5" y="10.5" width="15" height="4" rx="1" fill="var(--logo)" opacity="0.8"/>
    <rect x="6" y="5.5" width="12" height="4" rx="1" fill="var(--logo)" opacity="0.6"/>
  </svg>
  <h1>Nutzerverwaltung</h1>
  <a href="/">← zurück zum Chat</a>
</header>
<main>
  <div class="card">
    <h2 id="formtitle">Neuen Nutzer anlegen</h2>
    <label for="u">Benutzername</label>
    <input id="u" type="text" autocomplete="off">
    <label for="p">Passwort <span id="phint" style="display:none">(leer lassen = unverändert)</span></label>
    <input id="p" type="password" autocomplete="new-password">
    <label>Gruppen</label>
    <div class="groups" id="groups"></div>
    <div class="row">
      <label style="margin-top:12px"><input type="checkbox" id="admin"> Admin (darf Nutzer verwalten & neu einlesen)</label>
    </div>
    <button id="save">Speichern</button>
    <button id="cancel" class="edit" style="display:none">Abbrechen</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h2>Vorhandene Nutzer</h2>
    <table>
      <thead><tr><th>Benutzer</th><th>Gruppen</th><th>Rolle</th><th></th></tr></thead>
      <tbody id="users"></tbody>
    </table>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let groups = [];

  async function api(path, opts) {
    const r = await fetch(path, opts);
    let data = null; try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
    return data;
  }

  function renderGroups(selected) {
    selected = selected || [];
    $('groups').innerHTML = groups.map(g =>
      `<label><input type="checkbox" value="${g}" ${selected.includes(g) ? 'checked' : ''}> ${g}</label>`
    ).join('') || '<span style="color:var(--muted)">keine Gruppen definiert</span>';
  }

  function selectedGroups() {
    return [...document.querySelectorAll('#groups input:checked')].map(c => c.value);
  }

  function resetForm() {
    $('formtitle').textContent = 'Neuen Nutzer anlegen';
    $('u').value = ''; $('u').removeAttribute('readonly');
    $('p').value = ''; $('phint').style.display = 'none';
    $('admin').checked = false;
    renderGroups([]);
    $('cancel').style.display = 'none';
    $('msg').textContent = '';
  }

  function editUser(u) {
    $('formtitle').textContent = 'Nutzer bearbeiten: ' + u.username;
    $('u').value = u.username; $('u').setAttribute('readonly', 'readonly');
    $('p').value = ''; $('phint').style.display = 'inline';
    $('admin').checked = !!u.admin;
    renderGroups(u.groups || []);
    $('cancel').style.display = 'inline-block';
    window.scrollTo(0, 0);
  }

  async function loadUsers() {
    const users = await api('/api/admin/users');
    $('users').innerHTML = users.map(u => `
      <tr>
        <td>${u.username}</td>
        <td>${(u.groups || []).join(', ') || '—'}</td>
        <td>${u.admin ? '<span class="badge">Admin</span>' : 'Nutzer'}</td>
        <td style="text-align:right; white-space:nowrap">
          <button class="edit" data-edit='${JSON.stringify(u)}'>Bearbeiten</button>
          <button class="del" data-del="${u.username}">Löschen</button>
        </td>
      </tr>`).join('');
    document.querySelectorAll('[data-edit]').forEach(b =>
      b.onclick = () => editUser(JSON.parse(b.getAttribute('data-edit'))));
    document.querySelectorAll('[data-del]').forEach(b =>
      b.onclick = () => delUser(b.getAttribute('data-del')));
  }

  async function delUser(username) {
    if (!confirm('Nutzer "' + username + '" wirklich löschen?')) return;
    try {
      await api('/api/admin/users/delete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
      });
      await loadUsers();
    } catch (e) { setMsg(e.message, true); }
  }

  function setMsg(text, err) {
    const m = $('msg'); m.textContent = text; m.className = 'msg ' + (err ? 'err' : 'ok');
  }

  $('save').onclick = async () => {
    const body = {
      username: $('u').value.trim(),
      password: $('p').value,
      groups: selectedGroups(),
      admin: $('admin').checked,
    };
    try {
      await api('/api/admin/users', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      setMsg('Gespeichert.', false);
      resetForm();
      await loadUsers();
    } catch (e) { setMsg(e.message, true); }
  };
  $('cancel').onclick = resetForm;

  (async () => {
    try {
      groups = await api('/api/admin/groups');
      renderGroups([]);
      await loadUsers();
    } catch (e) { setMsg('Fehler beim Laden: ' + e.message, true); }
  })();
</script>
</body>
</html>
