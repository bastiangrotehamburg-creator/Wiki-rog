<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki-rog</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --border: #e3e3e8; --text: #1a1a1e;
    --muted: #6b6b76; --accent: #3b5bdb; --user: #eef2ff; --bot: #f4f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --panel: #1f1f24; --border: #33333b;
      --text: #eaeaf0; --muted: #9a9aa6; --accent: #7c93f5; --user: #23304d; --bot: #24242b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  #chat { display: flex; flex-direction: column; gap: 14px; padding-bottom: 100px; }
  .msg { padding: 12px 14px; border-radius: 12px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word; }
  .user { background: var(--user); align-self: flex-end; max-width: 85%; }
  .bot { background: var(--bot); align-self: flex-start; max-width: 95%;
    border: 1px solid var(--border); }
  .sources { margin-top: 10px; font-size: 13px; color: var(--muted);
    border-top: 1px dashed var(--border); padding-top: 8px; }
  .sources a { color: var(--accent); }
  form { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
    border-top: 1px solid var(--border); padding: 12px 16px; }
  .row { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  input { flex: 1; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; }
  button { padding: 12px 18px; border: 0; border-radius: 10px; background: var(--accent);
    color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>📚 Wiki-rog</h1>
  <p>Fragen zum BookStack-Wiki – lokal via Ollama, Antworten nur aus dem Wiki.</p>
</header>
<main>
  <div id="chat"></div>
</main>
<form id="form">
  <div class="row">
    <input id="q" autocomplete="off" placeholder="Frag das Wiki …" required>
    <button id="send" type="submit">Senden</button>
  </div>
</form>
<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('q');
  const sendBtn = document.getElementById('send');

  function addMsg(cls, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    chat.appendChild(el);
    window.scrollTo(0, document.body.scrollHeight);
    return el;
  }

  function linkify(text) {
    return text.replace(/(https?:\/\/[^\s]+)/g,
      '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    addMsg('user', q);
    input.value = '';
    sendBtn.disabled = true;

    const bot = addMsg('bot', '');
    let answer = '';
    const es = new EventSource('/api/ask?q=' + encodeURIComponent(q));

    es.addEventListener('token', (ev) => {
      answer += JSON.parse(ev.data);
      bot.textContent = answer;
      window.scrollTo(0, document.body.scrollHeight);
    });
    es.addEventListener('sources', (ev) => {
      const src = JSON.parse(ev.data);
      if (src && src.trim()) {
        const s = document.createElement('div');
        s.className = 'sources';
        s.innerHTML = '<strong>Quellen</strong><br>' + linkify(src).replace(/\n/g, '<br>');
        bot.appendChild(s);
      }
    });
    es.addEventListener('error-msg', (ev) => {
      bot.textContent = 'Fehler: ' + JSON.parse(ev.data);
    });
    const finish = () => { es.close(); sendBtn.disabled = false; input.focus(); };
    es.addEventListener('done', finish);
    es.onerror = () => { finish(); };
  });
</script>
</body>
</html>
