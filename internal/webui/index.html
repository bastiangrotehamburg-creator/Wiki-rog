<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki-rog</title>
<style>
  :root {
    --bg: #f5f7f9; --panel: #ffffff; --border: #dfe4ea; --text: #1a2430;
    --muted: #5b6b7b; --accent: #206ea7; --accent-hover: #1b5e8f;
    --user: #e3f0f8; --bot: #f4f6f8; --logo: #206ea7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12181e; --panel: #1a222b; --border: #2b3742;
      --text: #e8eef4; --muted: #93a3b3; --accent: #4a9fd4; --accent-hover: #64b0e0;
      --user: #163449; --bot: #1e2831; --logo: #67b0dc;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12181e; --panel: #1a222b; --border: #2b3742;
    --text: #e8eef4; --muted: #93a3b3; --accent: #4a9fd4; --accent-hover: #64b0e0;
    --user: #163449; --bot: #1e2831; --logo: #67b0dc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; max-width: 820px; margin: 0 auto; }
  .brand svg { flex: none; }
  .brand h1 { margin: 0; font-size: 18px; letter-spacing: -.2px; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .logout { display: none; margin-left: auto; align-self: center; font-size: 13px;
    color: var(--accent); text-decoration: none; border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 8px; white-space: nowrap; }
  .logout:hover { border-color: var(--accent); }
  body[data-auth="1"] .logout { display: inline-block; }
  /* Admin-Leiste */
  .adminbar { display: none; align-items: center; gap: 12px; flex-wrap: wrap;
    max-width: 820px; margin: 10px auto 0; padding: 10px 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    border: 1px solid var(--border); font-size: 13px; }
  body[data-admin="1"] .adminbar { display: flex; }
  .adminbar button { padding: 8px 14px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 13px; cursor: pointer; }
  .adminbar button:hover { background: var(--accent-hover); }
  .adminbar button:disabled { opacity: .6; cursor: default; }
  .adminbar label { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .adminbar .status { color: var(--muted); margin-left: auto; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  #chat { display: flex; flex-direction: column; gap: 14px; padding-bottom: 110px; }
  .msg { padding: 12px 14px; border-radius: 14px; line-height: 1.55;
    white-space: pre-wrap; word-wrap: break-word; }
  .user { background: var(--user); align-self: flex-end; max-width: 85%;
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
  .bot { background: var(--bot); align-self: flex-start; max-width: 95%;
    border: 1px solid var(--border); }
  .sources { margin-top: 10px; font-size: 13px; color: var(--muted);
    border-top: 1px dashed var(--border); padding-top: 8px; }
  .sources a { color: var(--accent); }
  /* Leerer Startzustand */
  #empty { text-align: center; color: var(--muted); padding: 48px 12px 24px; }
  #empty .badge { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 14px;
    display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, transparent); }
  #empty h2 { margin: 0 0 6px; color: var(--text); font-size: 19px; }
  #empty p { margin: 0 auto; max-width: 420px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 8px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  form { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
    border-top: 1px solid var(--border); padding: 12px 16px; }
  .row { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  input { flex: 1; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; }
  input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
  button { padding: 12px 18px; border: 0; border-radius: 10px; background: var(--accent);
    color: #fff; font-size: 15px; cursor: pointer; }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body data-auth="0" data-admin="0">
<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <!-- Bücherstapel (BookStack-Anmutung) -->
      <rect x="3" y="15.5" width="18" height="4" rx="1" fill="var(--logo)"/>
      <rect x="4.5" y="10.5" width="15" height="4" rx="1" fill="var(--logo)" opacity="0.8"/>
      <rect x="6" y="5.5" width="12" height="4" rx="1" fill="var(--logo)" opacity="0.6"/>
    </svg>
    <div>
      <h1>Wiki-rog</h1>
      <p>Fragen zum BookStack-Wiki – lokal via Ollama, Antworten nur aus dem Wiki.</p>
    </div>
    <a class="logout" id="logout" href="/logout">Abmelden</a>
  </div>
</header>
<div class="adminbar" id="adminbar">
  <button id="reindex" type="button">Wiki neu einlesen</button>
  <label><input type="checkbox" id="reset"> komplett neu (reset)</label>
  <span class="status" id="astatus">bereit</span>
</div>
<main>
  <div id="empty">
    <div class="badge">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="15.5" width="18" height="4" rx="1" fill="var(--logo)"/>
        <rect x="4.5" y="10.5" width="15" height="4" rx="1" fill="var(--logo)" opacity="0.8"/>
        <rect x="6" y="5.5" width="12" height="4" rx="1" fill="var(--logo)" opacity="0.6"/>
      </svg>
    </div>
    <h2>Frag dein Wiki</h2>
    <p>Stell eine Frage – die Antwort stammt ausschließlich aus deinem BookStack-Wiki,
       inklusive Quellenangaben.</p>
    <div class="chips">
      <button type="button" class="chip">Wie beantrage ich Urlaub?</button>
      <button type="button" class="chip">Welche VPN-Software nutzen wir?</button>
      <button type="button" class="chip">Wie richte ich mein E-Mail-Konto ein?</button>
    </div>
  </div>
  <div id="chat"></div>
</main>
<form id="form">
  <div class="row">
    <input id="q" autocomplete="off" placeholder="Frag das Wiki …" required>
    <button id="send" type="submit">Senden</button>
  </div>
</form>
<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('q');
  const sendBtn = document.getElementById('send');
  const empty = document.getElementById('empty');

  document.querySelectorAll('.chip').forEach((c) => {
    c.addEventListener('click', () => {
      input.value = c.textContent;
      form.requestSubmit();
    });
  });

  function addMsg(cls, text) {
    if (empty) empty.style.display = 'none';
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    chat.appendChild(el);
    window.scrollTo(0, document.body.scrollHeight);
    return el;
  }

  function linkify(text) {
    return text.replace(/(https?:\/\/[^\s]+)/g,
      '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    addMsg('user', q);
    input.value = '';
    sendBtn.disabled = true;

    const bot = addMsg('bot', '');
    let answer = '';
    const es = new EventSource('/api/ask?q=' + encodeURIComponent(q));

    es.addEventListener('token', (ev) => {
      answer += JSON.parse(ev.data);
      bot.textContent = answer;
      window.scrollTo(0, document.body.scrollHeight);
    });
    es.addEventListener('sources', (ev) => {
      const src = JSON.parse(ev.data);
      if (src && src.trim()) {
        const s = document.createElement('div');
        s.className = 'sources';
        s.innerHTML = '<strong>Quellen</strong><br>' + linkify(src).replace(/\n/g, '<br>');
        bot.appendChild(s);
      }
    });
    es.addEventListener('error-msg', (ev) => {
      bot.textContent = 'Fehler: ' + JSON.parse(ev.data);
    });
    const finish = () => { es.close(); sendBtn.disabled = false; input.focus(); };
    es.addEventListener('done', finish);
    es.onerror = () => { finish(); };
  });

  // --- Admin: Wiki neu einlesen -------------------------------------------
  if (document.body.dataset.admin === '1') {
    const reindexBtn = document.getElementById('reindex');
    const resetBox = document.getElementById('reset');
    const astatus = document.getElementById('astatus');
    let polling = null;

    function render(st) {
      if (st.running) {
        reindexBtn.disabled = true;
        const last = (st.log && st.log.length) ? st.log[st.log.length - 1] : 'läuft …';
        astatus.textContent = '⏳ ' + last;
      } else {
        reindexBtn.disabled = false;
        if (st.error) astatus.textContent = '⚠️ ' + (st.result || st.error);
        else if (st.result) astatus.textContent = '✅ ' + st.result;
        else astatus.textContent = 'bereit';
        if (polling) { clearInterval(polling); polling = null; }
      }
    }

    function poll() {
      fetch('/api/admin/status').then(r => r.json()).then(render).catch(() => {});
    }

    reindexBtn.addEventListener('click', () => {
      const reset = resetBox.checked ? '1' : '0';
      astatus.textContent = '⏳ starte …';
      reindexBtn.disabled = true;
      fetch('/api/admin/reindex?reset=' + reset, { method: 'POST' })
        .then(async (r) => {
          const st = await r.json().catch(() => ({}));
          if (!r.ok) { astatus.textContent = '⚠️ ' + (st.error || 'Fehler'); reindexBtn.disabled = false; return; }
          render(st);
          if (!polling) polling = setInterval(poll, 2000);
        })
        .catch((e) => { astatus.textContent = '⚠️ ' + e; reindexBtn.disabled = false; });
    });

    // Beim Laden Status prüfen (falls gerade ein Lauf aktiv ist)
    fetch('/api/admin/status').then(r => r.json()).then((st) => {
      render(st);
      if (st.running && !polling) polling = setInterval(poll, 2000);
    }).catch(() => {});
  }
</script>
</body>
</html>
