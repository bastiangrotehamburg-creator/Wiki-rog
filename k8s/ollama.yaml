# Ollama – lokaler LLM/Embedding-Server, reiner CPU-Betrieb (keine GPU-Ressourcen).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: wiki-rog
  labels:
    app.kubernetes.io/part-of: wiki-rog
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: wiki-rog
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: wiki-rog
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO-Volume: nur ein Pod gleichzeitig
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/part-of: wiki-rog
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            # Wie lange Modelle im RAM bleiben (weniger Kaltstarts)
            - name: OLLAMA_KEEP_ALIVE
              value: "1h"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          # CPU-only: bewusst KEINE nvidia.com/gpu-Ressourcen.
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "6Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: wiki-rog
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: wiki-rog
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - port: 11434
      targetPort: 11434
      name: http
