# Aktiviert Login + gruppenbasierten Zugriff in der WebUI.
# Kopiere nach k8s/access-secret.yaml (gitignored) und fülle die Werte.
#
# Passwort-Hashes erzeugen (lokal gebautes Binary oder im Container):
#   wiki-rog hashpw 'MeinPasswort'
# SESSION_SECRET: langer Zufallswert, z. B.:  openssl rand -hex 32
#
# Alternativ per kubectl (access.json aus Datei):
#   kubectl -n wiki-rog create secret generic wiki-rog-access \
#     --from-file=access.json=config/access.json \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: wiki-rog-access
  namespace: wiki-rog
  labels:
    app.kubernetes.io/part-of: wiki-rog
type: Opaque
stringData:
  SESSION_SECRET: "ERSETZEN_durch_langen_zufallswert"
  access.json: |
    {
      "groups": {
        "all": { "collection": "bookstack-all",
                 "bookstack_token_id": "TOKEN_ID_ALLE", "bookstack_token_secret": "TOKEN_SECRET_ALLE" },
        "it":  { "collection": "bookstack-it",
                 "bookstack_token_id": "TOKEN_ID_IT", "bookstack_token_secret": "TOKEN_SECRET_IT" },
        "hr":  { "collection": "bookstack-hr",
                 "bookstack_token_id": "TOKEN_ID_HR", "bookstack_token_secret": "TOKEN_SECRET_HR" }
      },
      "users": [
        {
          "username": "admin",
          "password_hash": "pbkdf2_sha256$210000$ERSETZEN$ERSETZEN",
          "groups": ["it", "hr", "all"],
          "admin": true
        },
        {
          "username": "alice",
          "password_hash": "pbkdf2_sha256$210000$ERSETZEN$ERSETZEN",
          "groups": ["hr", "all"]
        }
      ]
    }
# Hinweis: Die Gruppen-Tokens hier ermöglichen dem Admin-Button das Neu-Einlesen
# direkt aus der WebUI. Alternativ ohne Tokens hier: per Ingest-Jobs
# (k8s/ingest-groups-example.yaml) indexieren.
