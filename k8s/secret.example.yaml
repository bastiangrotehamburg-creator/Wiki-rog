# Kopiere diese Datei nach k8s/secret.yaml und trage deine echten Werte ein.
# secret.yaml ist per .gitignore ausgeschlossen und wird NICHT eingecheckt.
#
# Alternativ ohne Datei anlegen:
#   kubectl -n wiki-rog create secret generic wiki-rog-secret \
#     --from-literal=BOOKSTACK_TOKEN_ID=dein_token_id \
#     --from-literal=BOOKSTACK_TOKEN_SECRET=dein_token_secret
apiVersion: v1
kind: Secret
metadata:
  name: wiki-rog-secret
  namespace: wiki-rog
  labels:
    app.kubernetes.io/part-of: wiki-rog
type: Opaque
stringData:
  BOOKSTACK_TOKEN_ID: "dein_token_id"
  BOOKSTACK_TOKEN_SECRET: "dein_token_secret"
