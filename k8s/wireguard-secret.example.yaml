# WireGuard-Client-Config für den Dev-VPN-Zugang.
# Kopiere nach k8s/wireguard-secret.yaml (gitignored) und trage deine Werte ein.
#
# - PrivateKey: privater Schlüssel DIESES Clients (wg genkey)
# - Address:    Tunnel-IP dieses Clients (muss auf dem Server als AllowedIPs stehen)
# - [Peer]:     dein VPN-Server (PublicKey + Endpoint)
# - AllowedIPs: das VPN-Subnetz, damit andere Peers den Client erreichen können.
#               (NICHT 0.0.0.0/0 nötig – wir routen nur den VPN-Verkehr.)
#
# Zugriff danach von einem anderen VPN-Gerät:  http://<Address-ohne-/32>:8080
apiVersion: v1
kind: Secret
metadata:
  name: wireguard-config
  namespace: wiki-rog
  labels:
    app.kubernetes.io/part-of: wiki-rog
    app.kubernetes.io/component: dev-vpn
type: Opaque
stringData:
  wg0.conf: |
    [Interface]
    PrivateKey = DEIN_CLIENT_PRIVATE_KEY
    Address = 10.13.13.2/32

    [Peer]
    PublicKey = DEIN_SERVER_PUBLIC_KEY
    # PresharedKey = OPTIONALER_PSK
    Endpoint = vpn.example.com:51820
    AllowedIPs = 10.13.13.0/24
    PersistentKeepalive = 25
