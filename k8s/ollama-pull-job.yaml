# Einmaliger Job: lädt die Modelle in das ollama-models-PVC.
#
# WICHTIG (Sicherheit): Der Pull läuft NICHT über den produktiven Ollama-Server,
# sondern in einem eigenen, kurzlebigen Pod, der eine LOKALE Ollama-Instanz
# startet und die Modelle direkt ins gemeinsame PVC schreibt. Nur DIESER Pod
# darf ins Internet (siehe networkpolicy.yaml: ollama-pull-egress). Der
# produktive Ollama-Server bekommt dadurch KEINEN Egress und kann keine Daten
# nach außen senden – er liest die Modelle nur vom PVC.
#
# Idempotent – bereits vorhandene Modelle werden nicht erneut geladen.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-models
  namespace: wiki-rog
  labels:
    app.kubernetes.io/part-of: wiki-rog
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-pull
        app.kubernetes.io/part-of: wiki-rog
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: ollama/ollama:latest
          env:
            - name: OLLAMA_HOST
              value: "127.0.0.1:11434"   # lokale Instanz, nicht der Service
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: wiki-rog-config
                  key: OLLAMA_LLM_MODEL
            - name: EMBED_MODEL
              valueFrom:
                configMapKeyRef:
                  name: wiki-rog-config
                  key: OLLAMA_EMBED_MODEL
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Starte lokale Ollama-Instanz zum Herunterladen ..."
              ollama serve &
              SRV=$!
              until ollama list >/dev/null 2>&1; do sleep 2; done
              echo "Lade Modelle ins PVC ..."
              ollama pull "$LLM_MODEL"
              ollama pull "$EMBED_MODEL"
              echo "Vorhandene Modelle:"
              ollama list
              kill "$SRV" 2>/dev/null || true
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
