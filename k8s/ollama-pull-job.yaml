# Einmaliger Job: lädt die (kleinen) Modelle in den Ollama-Server.
# Idempotent – ein erneuter Lauf lädt bereits vorhandene Modelle nicht neu.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-models
  namespace: wiki-rog
  labels:
    app.kubernetes.io/part-of: wiki-rog
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: wiki-rog
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: ollama/ollama:latest
          env:
            - name: OLLAMA_HOST
              value: "http://ollama:11434"
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: wiki-rog-config
                  key: OLLAMA_LLM_MODEL
            - name: EMBED_MODEL
              valueFrom:
                configMapKeyRef:
                  name: wiki-rog-config
                  key: OLLAMA_EMBED_MODEL
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Warte auf Ollama unter $OLLAMA_HOST ..."
              until ollama list >/dev/null 2>&1; do
                sleep 3
              done
              echo "Ollama bereit. Lade Modelle ..."
              ollama pull "$LLM_MODEL"
              ollama pull "$EMBED_MODEL"
              echo "Fertig. Verfügbare Modelle:"
              ollama list
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
