# Einmaliger Ingest-Job: liest das externe BookStack aus und baut den Index.
# Erneut ausführen zum Aktualisieren:
#   kubectl -n wiki-rog delete job wiki-rog-ingest --ignore-not-found
#   kubectl apply -f k8s/ingest-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: wiki-rog-ingest
  namespace: wiki-rog
  labels:
    app.kubernetes.io/name: wiki-rog-ingest
    app.kubernetes.io/part-of: wiki-rog
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: wiki-rog
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ingest
          image: wiki-rog:latest
          imagePullPolicy: IfNotPresent
          args: ["ingest"]
          envFrom:
            - configMapRef:
                name: wiki-rog-config
            - secretRef:
                name: wiki-rog-secret
          volumeMounts:
            - name: store
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: store-data
