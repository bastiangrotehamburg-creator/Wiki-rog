apiVersion: v1
kind: ConfigMap
metadata:
  name: wiki-rog-config
  namespace: wiki-rog
  labels:
    app.kubernetes.io/part-of: wiki-rog
data:
  # --- Ollama (clusterinterner Service) -------------------------------------
  OLLAMA_URL: "http://ollama:11434"
  # Kleines, CPU-freundliches Antwort-Modell (~1,3 GB). Alternativen:
  #   qwen2.5:1.5b, gemma2:2b, llama3.2:3b (etwas größer)
  OLLAMA_LLM_MODEL: "llama3.2:1b"
  OLLAMA_EMBED_MODEL: "nomic-embed-text"

  # --- Vektorspeicher -------------------------------------------------------
  # "local"  = eingebettet, pure Go (File unter STORE_DIR)   [Standard]
  # "qdrant" = externer Qdrant-Dienst (k8s/qdrant.yaml deployen, dann
  #            VECTOR_BACKEND auf "qdrant" setzen)
  VECTOR_BACKEND: "local"
  VECTOR_COLLECTION: "bookstack"
  STORE_DIR: "/data/store"
  QDRANT_URL: "http://qdrant:6333"

  # --- Chunking / Retrieval -------------------------------------------------
  CHUNK_SIZE: "1000"
  CHUNK_OVERLAP: "150"
  RETRIEVAL_TOP_K: "5"
  RETRIEVAL_MAX_DISTANCE: "1.0"

  # --- Web-Server -----------------------------------------------------------
  HTTP_ADDR: ":8080"

  # --- BookStack (EXTERN, außerhalb des Clusters) ---------------------------
  # Externe URL des Wikis eintragen. Token in wiki-rog-secret.
  # Ingest-Job/App brauchen dafür Egress nach außen (siehe networkpolicy.yaml).
  BOOKSTACK_URL: "https://wiki.example.com"
  BOOKSTACK_BOOK_IDS: ""
  BOOKSTACK_SHELF_IDS: ""
  # TLS-Prüfung des externen Wikis. Für private CA lieber SSL_CERT_FILE setzen
  # (CA als ConfigMap/Secret mounten) statt dies auf "false" zu stellen.
  BOOKSTACK_VERIFY_SSL: "true"
