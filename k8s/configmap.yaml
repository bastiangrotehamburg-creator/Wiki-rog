apiVersion: v1
kind: ConfigMap
metadata:
  name: wiki-rog-config
  namespace: wiki-rog
  labels:
    app.kubernetes.io/part-of: wiki-rog
data:
  # --- Ollama (clusterinterner Service) -------------------------------------
  OLLAMA_URL: "http://ollama:11434"
  # Kleines, CPU-freundliches Antwort-Modell (~1,3 GB). Alternativen:
  #   qwen2.5:1.5b, gemma2:2b, llama3.2:3b (etwas größer)
  OLLAMA_LLM_MODEL: "llama3.2:1b"
  # Kompaktes Embedding-Modell, CPU-tauglich
  OLLAMA_EMBED_MODEL: "nomic-embed-text"

  # --- Vektorspeicher / Chunking / Retrieval --------------------------------
  CHROMA_DIR: "/data/chroma"
  CHROMA_COLLECTION: "bookstack"
  CHUNK_SIZE: "1000"
  CHUNK_OVERLAP: "150"
  RETRIEVAL_TOP_K: "5"
  RETRIEVAL_MAX_DISTANCE: "1.0"

  # --- BookStack (nicht-geheime Teile) --------------------------------------
  # URL hier, Token in wiki-rog-secret. Optionale Filter (leer = alles):
  BOOKSTACK_URL: "https://wiki.example.com"
  BOOKSTACK_BOOK_IDS: ""
  BOOKSTACK_SHELF_IDS: ""
