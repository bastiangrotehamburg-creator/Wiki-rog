# Optional: Qdrant als externer Vektorspeicher (Alternative zum pure-Go-Backend).
# Aktivieren:
#   1) kubectl apply -f k8s/qdrant.yaml
#   2) in k8s/configmap.yaml VECTOR_BACKEND auf "qdrant" setzen
#   3) App neu ausrollen + Ingest erneut ausführen
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  namespace: wiki-rog
  labels:
    app.kubernetes.io/part-of: wiki-rog
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: wiki-rog
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: wiki-rog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/part-of: wiki-rog
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
              name: http
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qdrant-data
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: wiki-rog
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: wiki-rog
spec:
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - port: 6333
      targetPort: 6333
      name: http
