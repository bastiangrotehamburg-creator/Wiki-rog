# Wiki-rog Web-UI (Go-Binary, Befehl "serve") + Service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki-rog-app
  namespace: wiki-rog
  labels:
    app.kubernetes.io/name: wiki-rog-app
    app.kubernetes.io/part-of: wiki-rog
spec:
  replicas: 1
  strategy:
    type: Recreate            # teilt sich RWO-Volume mit dem Ingest-Job
  selector:
    matchLabels:
      app.kubernetes.io/name: wiki-rog-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wiki-rog-app
        app.kubernetes.io/part-of: wiki-rog
    spec:
      containers:
        - name: app
          image: wiki-rog:latest       # eigenes Image bauen & pushen (siehe README)
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: wiki-rog-config
            - secretRef:
                name: wiki-rog-secret
          env:
            # Session-Signaturschlüssel; optional -> ohne Secret bleibt Auth aus.
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: wiki-rog-access
                  key: SESSION_SECRET
                  optional: true
          volumeMounts:
            - name: store
              mountPath: /data
            - name: access
              mountPath: /etc/wiki-rog
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: store-data
        # Access-Konfiguration (Login/Gruppen); optional -> fehlt sie, läuft
        # die WebUI offen. Zum Aktivieren: Secret wiki-rog-access anlegen.
        - name: access
          secret:
            secretName: wiki-rog-access
            optional: true
            items:
              - key: access.json
                path: access.json
---
apiVersion: v1
kind: Service
metadata:
  name: wiki-rog-app
  namespace: wiki-rog
  labels:
    app.kubernetes.io/name: wiki-rog-app
    app.kubernetes.io/part-of: wiki-rog
spec:
  selector:
    app.kubernetes.io/name: wiki-rog-app
  ports:
    - port: 80
      targetPort: 8080
      name: http
