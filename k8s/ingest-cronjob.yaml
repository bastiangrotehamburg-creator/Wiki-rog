# Optional: regelmäßige Aktualisierung des Index (hier: täglich 03:00 UTC).
# Anwenden mit:  kubectl apply -f k8s/ingest-cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wiki-rog-ingest
  namespace: wiki-rog
  labels:
    app.kubernetes.io/name: wiki-rog-ingest
    app.kubernetes.io/part-of: wiki-rog
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: wiki-rog
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingest
              image: wiki-rog:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "cli.py", "ingest"]
              envFrom:
                - configMapRef:
                    name: wiki-rog-config
                - secretRef:
                    name: wiki-rog-secret
              volumeMounts:
                - name: chroma
                  mountPath: /data
              resources:
                requests:
                  cpu: "200m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
          volumes:
            - name: chroma
              persistentVolumeClaim:
                claimName: chroma-data
