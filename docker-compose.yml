# Wiki-rog auf einem VPS via Docker Compose.
#
# Schnellstart:
#   cp .env.example .env            # anpassen (BookStack-URL + Token)
#   docker compose up -d ollama     # Ollama starten
#   docker compose run --rm model-init   # Modelle laden (einmalig)
#   docker compose run --rm ingest --reset   # Wiki indexieren
#   docker compose up -d app        # WebUI starten -> http://<VPS>:8080
#
# Login/Admin aktivieren (optional): config/access.json anlegen (siehe
# config/access.example.json) + SESSION_SECRET in .env setzen.
name: wiki-rog

services:
  # --- Ollama: lokales LLM + Embeddings -----------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "1h"
    volumes:
      - ollama_models:/root/.ollama
    # Standardmäßig NICHT nach außen exponiert – nur intern erreichbar.
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- Einmaliger Modell-Download -----------------------------------------
  # Aufruf:  docker compose run --rm model-init
  model-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_LLM_MODEL: "${OLLAMA_LLM_MODEL:-llama3.2:1b}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Lade Modelle in Ollama ..."
        ollama pull "$$OLLAMA_LLM_MODEL"
        ollama pull "$$OLLAMA_EMBED_MODEL"
        ollama list
    restart: "no"

  # --- WebUI (Go-Binary, Befehl serve) ------------------------------------
  app:
    build: .
    image: wiki-rog:latest
    pull_policy: build          # lokal bauen, nicht aus Registry ziehen
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # feste Werte für den Container-Betrieb (überschreiben .env bei Bedarf)
      OLLAMA_URL: "http://ollama:11434"
      STORE_DIR: "/data/store"
      HTTP_ADDR: ":8080"
      ACCESS_CONFIG: "/etc/wiki-rog/access.json"
    volumes:
      - store_data:/data
      # Login/Gruppen optional: fehlt config/access.json, läuft die WebUI offen.
      - ./config:/etc/wiki-rog:ro
    ports:
      # Auf dem VPS am besten hinter einen Reverse-Proxy (TLS) hängen und nur
      # lokal binden:  "127.0.0.1:8080:8080".  Direkt erreichbar:  "8080:8080".
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"

  # --- Ingest (on demand) -------------------------------------------------
  # Aufruf:  docker compose run --rm ingest            (inkrementell)
  #          docker compose run --rm ingest --reset    (Neuaufbau)
  ingest:
    build: .
    image: wiki-rog:latest
    pull_policy: build          # lokal bauen, nicht aus Registry ziehen
    profiles: ["tools"]
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_URL: "http://ollama:11434"
      STORE_DIR: "/data/store"
      ACCESS_CONFIG: "/etc/wiki-rog/access.json"
    volumes:
      - store_data:/data
      - ./config:/etc/wiki-rog:ro
    # entrypoint enthält bereits "ingest", damit
    #   docker compose run --rm ingest            -> inkrementell
    #   docker compose run --rm ingest --reset    -> Neuaufbau
    # beide funktionieren (angehängte Args landen nach "ingest").
    entrypoint: ["/app/wiki-rog", "ingest"]
    command: []

volumes:
  ollama_models:
  store_data:
